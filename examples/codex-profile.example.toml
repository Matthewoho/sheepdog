# Codex 配置档示例：让 sheepdog 驱动的 Codex 会话能自己用 lark-cli 发飞书、写 sheepdog 的状态目录。
# 用法：复制到 ~/.codex/sheepdog.config.toml，sheepdog 配置里写 [hosts.codex] profile = "sheepdog"。
# sheepdog 读这份文件，把每一项展开成 -c 参数传给它自己起的 `codex app-server`（叠在 ~/.codex/config.toml 上面），
# 例如 -c sandbox_mode="workspace-write"；你自己在 Codex 应用里的会话不受影响。
# 这些权限由你自己决定、自己维护：sheepdog 只读、原样展开，不改这份文件，也不传任何别的沙箱、审批参数。
# 只对之后新开的会话生效：Codex 建线程时把沙箱策略记在线程上，之后续接也沿用；改了这份文件，老会话要退休换新。
# 只支持字符串、布尔、整数、浮点和它们的数组；键只能是 [A-Za-z0-9_-]，写了日期或表的数组会按配置档错误处理。

# 能写工作目录和下面列出的目录，其他地方只读
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# 放开网络：lark-cli 要连飞书
network_access = true
# 额外可写的目录，写绝对路径：lark-cli 的登录态目录、sheepdog 的状态目录（交回执、登记等待要写这里）
writable_roots = [
  "/Users/<你的用户名>/.lark-cli",
  "/Users/<你的用户名>/.local/state/sheepdog",
]
