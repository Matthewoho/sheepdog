<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'/>" />
  <title>Sheepdog Workbench · 管理与可观测后台</title>
  <style>
    :root, [data-theme="dark"] {
      --bg-root: #0B0F19;
      --bg-sidebar: #0F1422;
      --bg-surface: #131A2B;
      --bg-elevated: #1A2338;
      --bg-hover: rgba(99, 102, 241, 0.10);
      --bg-active: rgba(99, 102, 241, 0.18);
      --border-hairline: rgba(148, 163, 184, 0.13);
      --border-strong: rgba(148, 163, 184, 0.24);
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-indigo: #6366F1;
      --accent-amber: #F59E0B;
      --accent-emerald: #10B981;
      --accent-rose: #F43F5E;
      --accent-sky: #38BDF8;
      --shadow-pop: 0 12px 32px rgba(0, 0, 0, 0.55);
    }
    [data-theme="light"] {
      --bg-root: #F7F6F2;
      --bg-sidebar: #EFECE6;
      --bg-surface: #FFFFFF;
      --bg-elevated: #F3F1EC;
      --bg-hover: rgba(79, 70, 229, 0.08);
      --bg-active: rgba(79, 70, 229, 0.14);
      --border-hairline: rgba(15, 23, 42, 0.10);
      --border-strong: rgba(15, 23, 42, 0.20);
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --accent-indigo: #4F46E5;
      --accent-amber: #D97706;
      --accent-emerald: #059669;
      --accent-rose: #E11D48;
      --accent-sky: #0284C7;
      --shadow-pop: 0 10px 28px rgba(15, 23, 42, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100vh; overflow: hidden;
      background: var(--bg-root); color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Hiragino Sans GB", sans-serif;
      font-size: 13px; line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .mono {
      font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    .tabular { font-variant-numeric: tabular-nums; }

    /* 主三栏空间骨架：左栏导览 ⊥ 中栏主视图 ⊥ 右栏全高舞台 */
    .workbench-shell {
      display: flex; width: 100vw; height: 100vh; overflow: hidden;
    }
    .left-sidebar {
      width: 264px; min-width: 264px; height: 100vh;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-hairline);
      display: flex; flex-direction: column; justify-content: space-between;
      user-select: none;
    }
    .center-main {
      flex: 1; min-width: 480px; height: 100vh;
      background: var(--bg-root);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .right-stage {
      width: 460px; min-width: 420px; height: 100vh;
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border-hairline);
      display: flex; flex-direction: column; overflow: hidden;
      transition: width 0.18s ease;
    }
    .right-stage.collapsed {
      width: 0; min-width: 0; border-left: none;
    }

    /* 通用线性 SVG 图标按钮（严格 1.5px stroke，零文字堆砌） */
    .icon-btn {
      width: 28px; height: 28px; border-radius: 6px;
      border: 1px solid transparent; background: transparent;
      color: var(--text-secondary); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
      flex-shrink: 0;
    }
    .icon-btn:hover {
      background: var(--bg-hover); color: var(--text-primary);
    }
    .icon-btn.active {
      background: var(--bg-active); color: var(--accent-indigo);
      border-color: rgba(99, 102, 241, 0.35);
    }
    .icon-btn:focus-visible {
      outline: 2px solid var(--accent-indigo); outline-offset: 1px;
    }

    /* 左上角顶栏 + 暗色无文字 WebSocket 状态指示器 */
    .left-brand-bar {
      height: 44px; padding: 0 12px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand-cluster {
      display: flex; align-items: center; gap: 8px;
    }
    .brand-title {
      font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
      color: var(--text-primary); white-space: nowrap;
    }
    .ws-indicator {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.20);
      display: inline-block; flex-shrink: 0;
    }
    .ws-indicator.degraded {
      background: var(--accent-amber);
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.22);
    }
    .nav-icon-group {
      display: flex; align-items: center; gap: 4px;
    }

    /* 左栏会话树与成员列表（严格遵守单行最多 3 可见元素配额） */
    .left-tree-scroll {
      flex: 1; overflow-y: auto; padding: 8px 8px 12px;
    }
    .tree-section-header {
      padding: 8px 8px 4px;
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      display: flex; align-items: center; justify-content: space-between;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .specialist-row, .meru-human-member-row {
      position: relative;
      height: 32px; padding: 0 8px; border-radius: 6px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; color: var(--text-primary);
      transition: background 0.12s ease;
    }
    .specialist-row:hover, .meru-human-member-row:hover {
      background: var(--bg-hover);
    }
    .specialist-row.selected, .meru-human-member-row.selected {
      background: var(--bg-active);
    }
    .row-left-cluster {
      display: flex; align-items: center; gap: 8px;
      min-width: 0; flex: 1; padding-right: 26px;
    }
    .row-avatar {
      width: 18px; height: 18px; border-radius: 4px;
      background: var(--bg-elevated); color: var(--text-secondary);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .row-name {
      font-size: 13px; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted); flex-shrink: 0;
    }
    .status-dot.running { background: var(--accent-emerald); box-shadow: 0 0 6px rgba(16, 185, 129, 0.55); }
    .status-dot.waiting_human { background: var(--accent-amber); }
    .status-dot.attention, .status-dot.hook_blocked { background: var(--accent-rose); }
    .status-dot.active { background: var(--accent-sky); }

    /* 隐藏模型与 Tier 胶囊，保证行内零噪音 */
    .tier-pill, .model-badge { display: none !important; }

    /* Hover 最右端浮现 ⋯ 按钮，保证 statusLamp.left < dotsTrigger.left */
    .row-dots-btn {
      position: absolute; right: 6px; top: 4px;
      width: 24px; height: 24px; border-radius: 5px;
      border: none; background: transparent; color: var(--text-secondary);
      display: inline-flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; cursor: pointer;
    }
    .specialist-row:hover .row-dots-btn,
    .meru-human-member-row:hover .row-dots-btn,
    .row-dots-btn:focus-visible {
      opacity: 1; pointer-events: auto;
    }
    .row-dots-btn:hover {
      background: var(--bg-elevated); color: var(--text-primary);
    }

    /* 顶级会话行下方内嵌折叠 Subagent / 话题预览（1.5px 左侧细线，最多 3 行，单行截断） */
    .meru-realm-thread-preview {
      margin: 2px 0 6px 16px;
      padding-left: 10px;
      border-left: 1.5px solid var(--border-strong);
      display: flex; flex-direction: column; gap: 2px;
    }
    .thread-preview-line {
      height: 22px; max-height: 24px;
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 0 6px; border-radius: 4px; cursor: pointer;
    }
    .thread-preview-line:hover {
      background: var(--bg-hover); color: var(--text-primary);
    }
    .thread-preview-line .sub-agent-tag {
      font-size: 11px; color: var(--accent-indigo); font-weight: 500; flex-shrink: 0;
    }
    .thread-preview-line .sub-summary {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }

    /* 左栏底栏 Dock：单行 space-between，左头像昵称 ⊥ 右设置齿轮 */
    .utility-dock {
      height: 44px; padding: 8px 12px;
      border-top: 1px solid var(--border-hairline);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-sidebar);
    }
    .dock-profile-btn {
      border: none; background: transparent; color: var(--text-primary);
      display: inline-flex; align-items: center; gap: 8px;
      padding: 4px 6px; border-radius: 6px; cursor: pointer;
      font-size: 13px; font-weight: 500;
    }
    .dock-profile-btn:hover { background: var(--bg-hover); }

    /* 中栏顶栏 + 灵动岛（Dynamic Island） */
    .meru-center-topbar {
      height: 44px; padding: 0 16px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-shrink: 0;
    }
    .center-anchor-group {
      display: flex; align-items: center; gap: 10px; min-width: 0;
    }
    .center-view-title {
      font-size: 14px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap;
    }
    .center-view-sub {
      font-size: 12px; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 灵动岛：安静态（0 事件）左侧仅一根水平直线、中间文字为空 "" */
    .dynamic-island {
      position: relative;
      height: 26px; min-width: 68px; max-width: 320px;
      padding: 0 10px; border-radius: 999px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      display: inline-flex; align-items: center; gap: 8px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dynamic-island-line {
      width: 18px; height: 1.5px; border-radius: 2px;
      background: var(--text-muted); display: inline-block;
      transition: background 0.18s ease, width 0.18s ease;
    }
    .dynamic-island.has-events .dynamic-island-line {
      background: var(--accent-amber); width: 12px;
    }
    .dynamic-island-text {
      font-size: 12px; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dynamic-island-popover {
      position: absolute; top: 34px; left: 50%; transform: translateX(-50%) scale(0.96);
      width: 360px; max-height: 0; overflow: hidden; opacity: 0;
      background: var(--bg-elevated); border: 1px solid var(--border-strong);
      border-radius: 10px; box-shadow: var(--shadow-pop);
      transition: max-height 0.22s ease, opacity 0.18s ease, transform 0.18s ease;
      z-index: 90; pointer-events: none;
    }
    .dynamic-island.expanded .dynamic-island-popover {
      max-height: 280px; opacity: 1; transform: translateX(-50%) scale(1);
      pointer-events: auto; padding: 8px;
    }

    /* 顶栏 Golden Signals 极简指标带 */
    .golden-strip {
      display: grid; grid-template-columns: repeat(5, 1fr);
      border-bottom: 1px solid var(--border-hairline);
      background: var(--bg-surface); flex-shrink: 0;
    }
    .golden-cell {
      padding: 8px 10px; min-width: 0;
      border-right: 1px solid var(--border-hairline);
      display: flex; flex-direction: column; gap: 2px;
      overflow: hidden;
    }
    .golden-cell:last-child { border-right: none; }
    .golden-label {
      font-size: 11px; color: var(--text-secondary);
      display: flex; align-items: center; justify-content: space-between;
      white-space: nowrap; gap: 4px;
    }
    .golden-value {
      font-size: 15px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap;
    }
    .golden-sub {
      font-size: 11px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 中栏内容滚动区与视图工具条 */
    .center-Body-scroll {
      flex: 1; overflow-y: auto; padding: 14px 16px 28px;
    }
    .sub-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; gap: 10px;
    }
    .filter-pills {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .filter-pill {
      height: 26px; padding: 0 10px; border-radius: 6px;
      border: 1px solid var(--border-hairline);
      background: var(--bg-surface); color: var(--text-secondary);
      font-size: 12px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .filter-pill:hover { color: var(--text-primary); background: var(--bg-hover); }
    .filter-pill.active {
      background: var(--bg-active); color: var(--accent-indigo);
      border-color: rgba(99, 102, 241, 0.40); font-weight: 500;
    }
    .search-input-wrap {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg-surface); border: 1px solid var(--border-hairline);
      border-radius: 6px; padding: 0 8px; height: 28px; min-width: 220px;
    }
    .search-input-wrap input {
      border: none; background: transparent; color: var(--text-primary);
      font-size: 12px; width: 100%; outline: none;
    }

    /* 无边框甘特瀑布流表格（Let Layout Speak，零卡片套娃） */
    .waterfall-table {
      width: 100%; border-collapse: collapse;
    }
    .waterfall-table th {
      text-align: left; font-size: 11px; font-weight: 600;
      color: var(--text-muted); padding: 6px 10px;
      border-bottom: 1px solid var(--border-strong);
      white-space: nowrap;
    }
    .waterfall-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-hairline);
      vertical-align: middle; font-size: 12px;
    }
    .waterfall-row {
      cursor: pointer; transition: background 0.12s ease;
    }
    .waterfall-row:hover { background: var(--bg-hover); }
    .waterfall-row.selected { background: var(--bg-active); }

    .gantt-track {
      width: 100%; height: 8px; border-radius: 4px;
      background: var(--bg-elevated); overflow: hidden;
      display: flex; align-items: stretch;
    }
    .gantt-seg-ingest { background: var(--accent-sky); }
    .gantt-seg-queue { background: var(--accent-amber); }
    .gantt-seg-exec { background: var(--accent-indigo); }
    .gantt-seg-reply { background: var(--accent-emerald); }

    .state-tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; padding: 2px 7px; border-radius: 4px;
      background: var(--bg-elevated); color: var(--text-secondary);
      white-space: nowrap;
    }
    .state-tag.accepted, .state-tag.running, .state-tag.acked {
      color: var(--accent-emerald); background: rgba(16, 185, 129, 0.12);
    }
    .state-tag.overridden, .state-tag.attention, .state-tag.hook_blocked {
      color: var(--accent-rose); background: rgba(244, 63, 94, 0.14);
    }
    .state-tag.pending, .state-tag.waiting_human {
      color: var(--accent-amber); background: rgba(245, 158, 11, 0.14);
    }
    .state-tag.auto_resolved, .state-tag.active {
      color: var(--accent-sky); background: rgba(56, 189, 248, 0.12);
    }

    /* 右栏舞台标签栏（所有标签带 × 可关闭） */
    .meru-stage-tabs {
      height: 44px; padding: 0 10px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px; flex-shrink: 0;
    }
    .stage-tab-list {
      display: flex; align-items: center; gap: 4px; overflow-x: auto;
    }
    .meru-stage-tab {
      height: 28px; padding: 0 8px 0 10px; border-radius: 6px;
      border: 1px solid transparent; background: transparent;
      color: var(--text-secondary); font-size: 12px;
      display: inline-flex; align-items: center; gap: 6px;
      cursor: pointer; white-space: nowrap;
    }
    .meru-stage-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
    .meru-stage-tab.active {
      background: var(--bg-surface); color: var(--text-primary);
      border-color: var(--border-hairline); font-weight: 500;
    }
    .meru-stage-tab-close {
      width: 16px; height: 16px; border-radius: 4px;
      border: none; background: transparent; color: var(--text-muted);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .meru-stage-tab-close:hover {
      background: var(--bg-elevated); color: var(--text-primary);
    }

    /* 右栏舞台主体：1) 耗时追踪与会话步进面板；2) agy app 同款 100% 全高左右分栏文件目录 */
    .stage-body {
      flex: 1; height: calc(100vh - 44px); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .stage-trace-scroll {
      flex: 1; overflow-y: auto; padding: 14px;
    }
    .timeline-vertical {
      border-left: 1.5px solid var(--border-strong);
      margin-left: 8px; padding-left: 14px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .timeline-node {
      position: relative;
      display: flex; flex-direction: column; gap: 2px;
    }
    .timeline-node::before {
      content: ""; position: absolute; left: -19px; top: 5px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-indigo);
    }
    .timeline-node.wait::before { background: var(--accent-amber); }
    .timeline-node.done::before { background: var(--accent-emerald); }
    .timeline-node-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 600; color: var(--text-primary);
    }
    .timeline-node-meta {
      font-size: 11px; color: var(--text-secondary);
    }

    /* agy app 同款 100% 全高左右分栏文件视图 */
    .stage-files-3pane {
      flex: 1; height: 100%; min-height: 540px;
      display: flex; flex-direction: row; overflow: hidden;
    }
    .stage-pane-preview {
      flex: 1; height: 100%; min-height: 540px;
      background: var(--bg-root);
      overflow-y: auto; display: flex; flex-direction: column;
    }
    .preview-sticky-header {
      position: sticky; top: 0; z-index: 5;
      height: 32px; padding: 0 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; color: var(--text-secondary);
    }
    .code-lines-table {
      width: 100%; border-collapse: collapse; font-size: 12px;
    }
    .code-lines-table td {
      padding: 1px 8px; vertical-align: top; line-height: 1.5;
    }
    .code-line-num {
      width: 38px; text-align: right; color: var(--text-muted);
      user-select: none; border-right: 1px solid var(--border-hairline);
    }
    .code-line-text {
      white-space: pre; color: var(--text-primary); padding-left: 10px;
    }
    .workspace-tree-sidebar {
      width: 205px; min-width: 205px; height: 100%;
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border-hairline);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .workspace-tree-toolbar {
      height: 32px; padding: 0 8px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; font-weight: 600; color: var(--text-secondary);
    }
    .file-tree-group {
      padding: 6px 6px 10px;
    }
    .file-tree-group-title {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      padding: 4px 6px; display: flex; align-items: center; justify-content: space-between;
    }
    .file-tree-item {
      height: 26px; padding: 0 6px; border-radius: 5px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--text-secondary); cursor: pointer;
    }
    .file-tree-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .file-tree-item.active { background: var(--bg-active); color: var(--text-primary); }
    .file-type-badge {
      font-size: 10px; padding: 0 4px; border-radius: 3px;
      background: var(--bg-elevated); color: var(--accent-indigo);
      font-weight: 600;
    }

    /* 共享右键 / ⋯ 上下文菜单与轻量详情名片 */
    .shared-context-menu {
      position: fixed; z-index: 200;
      min-width: 176px; padding: 5px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 8px; box-shadow: var(--shadow-pop);
      display: none; flex-direction: column; gap: 2px;
    }
    .shared-context-menu.open { display: flex; }
    .ctx-menu-item {
      height: 28px; padding: 0 8px; border-radius: 5px;
      border: none; background: transparent; color: var(--text-primary);
      font-size: 12px; text-align: left; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
    }
    .ctx-menu-item:hover { background: var(--bg-hover); }

    /* 设置弹窗（⚙️） */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 180;
      background: rgba(0, 0, 0, 0.55);

    .settings-modal {
      width: 640px; max-width: 92vw; height: 420px;

</head>
<body>
  <div class="workbench-shell">
    <!-- 左栏：品牌状态 ⊥ 三级会话组与专席树 ⊥ 底栏 Dock -->

          <div class="nav-icon-group" role="navigation" aria-label="主视图切换">
            <button class="icon-btn active" data-nav="sessions" title="三级会话工作状态" aria-label="三级会话工作状态" id="nav-btn-sessions"></button>
            <button class="icon-btn" data-nav="waterfall" title="事件耗时瀑布流" aria-label="事件耗时瀑布流" id="nav-btn-waterfall"></button>
            <button class="icon-btn" data-nav="decisions" title="三层决策可观测" aria-label="三层决策可观测" id="nav-btn-decisions"></button>
            <button class="icon-btn" data-nav="admin" title="花名册与运维台账" aria-label="花名册与运维台账" id="nav-btn-admin"></button>

        </div>
      </div>

      <div class="left-tree-scroll" id="left-session-tree"></div>

      <div class="utility-dock" data-ui="utility-dock">
        <button class="dock-profile-btn" id="profile-trigger-btn" data-ui="profile-trigger" title="Matthew · 系统主理人">
          <span class="row-avatar" id="dock-avatar-svg"></span>
          <span>Matthew</span>
        </button>
        <button class="icon-btn" id="settings-trigger-btn" data-ui="settings-trigger" title="全局设置 (⌘,)" aria-label="全局设置"></button>
      </div>
    </aside>

    <!-- 中栏：顶栏 + 灵动岛 ⊥ Golden Signals ⊥ 四大可观测与管理视图 -->
    <main class="center-main">
      <header class="meru-center-topbar">
        <div class="center-anchor-group">
          <h1 class="center-view-title" id="center-view-title">三级会话工作状态</h1>
          <span class="center-view-sub" id="center-view-subtitle">Session Group · Primary Session · Subagent 实时遥测</span>
        </div>

        <div class="dynamic-island" id="dynamic-island" data-ui="dynamic-island" title="待拍板与门禁动态">
          <span class="dynamic-island-line"></span>
          <span class="dynamic-island-text" id="dynamic-island-text"></span>
          <div class="dynamic-island-popover" id="dynamic-island-popover"></div>

        <div class="nav-icon-group">
          <button class="icon-btn" id="btn-focus-search" title="搜索过滤 (⌘K)" aria-label="搜索过滤"></button>
          <button class="icon-btn" id="btn-refresh-all" title="刷新实时可观测数据" aria-label="刷新实时可观测数据"></button>
          <button class="icon-btn active" id="btn-toggle-stage" title="展开/收起右侧舞台" aria-label="展开/收起右侧舞台"></button>

        <div class="nav-icon-group">

  </div>

  <!-- 左键点 ⋯ 与右键菜单 100% 同源节点 -->
  <div class="shared-context-menu" id="shared-context-menu" role="menu"></div>

  <!-- 左下角 ⚙️ 全局设置弹窗 -->
  <div class="modal-backdrop" id="settings-modal-backdrop">
    <div class="settings-modal" role="dialog" aria-label="全局设置">
      <div class="settings-nav">
        <div class="tree-section-header">工作台设置</div>
        <button class="filter-pill active" style="width:100%;justify-content:flex-start;">外观与可观测</button>
      </div>
      <div class="settings-content">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <strong style="font-size:14px;">工作台偏好与守护进程信息</strong>
          <button class="icon-btn" id="btn-close-settings" title="关闭设置" aria-label="关闭设置"></button>

          <div>
            <div style="font-weight:500;">界面主题模式</div>
            <div style="font-size:12px;color:var(--text-secondary);">在深色曜石（#0B0F19）与浅色暖纸（#F7F6F2）之间切换</div>
          </div>
          <button class="filter-pill" id="btn-toggle-theme">切换深浅主题</button>

          <div>
            <div style="font-weight:500;">自动刷新水位</div>
            <div style="font-size:12px;color:var(--text-secondary);">每 8 秒增量拉取 SQLite 账本与 Stop Hook 遥测</div>
          </div>
          <span class="state-tag running mono" id="settings-version-tag">v0.7.99</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      /* 1. 受控 SVG 图标原语（1.5px stroke，严禁使用彩色 Emoji） */
      const ICONS = {
        sessions: '<path d="M4 6h16M4 12h10M4 18h16"/>',
        waterfall: '<path d="M3 5h6v3H3zM7 10.5h9v3H7zM11 16h10v3H11z"/>',
        decisions: '<path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"/>',
        admin: '<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 8a7 7 0 0 1 14 0"/>',
        search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
        refresh: '<path d="M20 11a8 8 0 1 0 2 5.3M20 4v7h-7"/>',
        panel: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/>',
        settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
        user: '<circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3 4-4.5 7-4.5s5.5 1.5 7 4.5"/>',
        bot: '<rect x="5" y="7" width="14" height="11" rx="2"/><path d="M12 4v3M9 12h.01M15 12h.01"/>',
        dots: '<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',
        close: '<path d="M6 6l12 12M18 6L6 18"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        folder: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2h9A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11z"/>',
        file: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
        check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
        shield: '<path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6l7-3z"/>'
      };

      function renderLinearIconSvg(name, size) {
        const s = size || 15;
        const body = ICONS[name] || ICONS.file;
        return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
      }

      const EMOJI_RE = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F\u200D]+/gu;
      const BANNED_RE = /ljl\/matthew|P1-P8|MER-108|护栏正常/gi;

      function cleanText(val) {
        return String(val == null ? "" : val).replace(EMOJI_RE, "").replace(BANNED_RE, "").trim();
      }

      function escHtml(val) {
        return cleanText(val)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fmtMs(ms) {
        if (ms == null || isNaN(ms)) return "-";
        const n = Number(ms);
        if (n < 1000) return Math.round(n) + "ms";
        if (n < 60000) return (n / 1000).toFixed(1) + "s";
        return (n / 60000).toFixed(1) + "m";
      }

      function fmtShortTime(iso) {
        if (!iso) return "-";
        const s = String(iso);
        const m = s.match(/T(\d{2}:\d{2}:\d{2})/);
        return m ? m[1] : s.slice(0, 19);
      }

      /* 全局状态 */
      const STATE = {
        activeView: "sessions",
        overview: null,
        sessionsData: { groups: [], sessions: [], recent_hook_calls: [] },
        selectedTopicId: "tp_bus",
        sessionDetail: null,
        waterfallData: { total: 0, offset: 0, limit: 50, events: [] },
        waterfallFilterRoute: "dispatch",
        waterfallQuery: "",
        selectedMessageId: "",
        eventTrace: null,
        decisionsData: null,
        decisionFilter: "all",
        adminData: null,
        workspaceFiles: { active_realm: [], whole_drive: [] },
        selectedFilePath: "config/config.toml",
        fileContent: { path: "config/config.toml", lines: [] },
        openStageTabs: [
          { id: "trace", title: "耗时与步进追踪" },
          { id: "files", title: "文件目录" }
        ],
        activeStageTab: "files",
        collapsedSubagentTopics: {},
        contextTargetTopic: null
      };

      /* 初始化静态图标按钮 */
      function initStaticIcons() {
        document.getElementById("nav-btn-sessions").innerHTML = renderLinearIconSvg("sessions", 15);
        document.getElementById("nav-btn-waterfall").innerHTML = renderLinearIconSvg("waterfall", 15);
        document.getElementById("nav-btn-decisions").innerHTML = renderLinearIconSvg("decisions", 15);
        document.getElementById("nav-btn-admin").innerHTML = renderLinearIconSvg("admin", 15);
        document.getElementById("dock-avatar-svg").innerHTML = renderLinearIconSvg("user", 13);
        document.getElementById("settings-trigger-btn").innerHTML = renderLinearIconSvg("settings", 15);
        document.getElementById("btn-focus-search").innerHTML = renderLinearIconSvg("search", 15);
        document.getElementById("btn-refresh-all").innerHTML = renderLinearIconSvg("refresh", 15);
        document.getElementById("btn-toggle-stage").innerHTML = renderLinearIconSvg("panel", 15);
        document.getElementById("btn-restore-stage-tabs").innerHTML = renderLinearIconSvg("plus", 14);
        document.getElementById("btn-close-settings").innerHTML = renderLinearIconSvg("close", 15);
      }

      async function apiGet(url) {
        const r = await fetch(url, { headers: { "Accept": "application/json" } });
        return await r.json();
      }

      async function apiAction(payload) {
        const r = await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        return await r.json();
      }

      /* 渲染顶部 Golden Signals 分位数带 */
      function renderGoldenSignals() {
        const el = document.getElementById("golden-signals-strip");
        if (!STATE.overview) return;
        const ov = STATE.overview;
        const lat = ov.latencies || {};
        const ws = ov.ws_health || {};
        const dot = document.getElementById("ws-status-dot");
        if (dot) {
          dot.className = "ws-indicator" + (ws.status === "online" ? "" : " degraded");
          dot.title = "原生飞书 WebSocket · conn=" + cleanText(ws.conn_id || "online") + " · ack=" + (ws.last_ack_ms || 0) + "ms";
        }
        document.getElementById("settings-version-tag").textContent = "v" + cleanText(ov.version || "0.7.99");

        // 更新灵动岛：0 事件时左侧一根直线 + 空文本 ""
        const openEscCount = (ov.counts && ov.counts.open_escalations) || 0;
        const attnCount = (ov.counts && ov.counts.topics_attention) || 0;
        const totalEvents = openEscCount + attnCount;
        const island = document.getElementById("dynamic-island");
        const islandText = document.getElementById("dynamic-island-text");
        const islandPop = document.getElementById("dynamic-island-popover");
        if (totalEvents === 0) {
          island.classList.remove("has-events", "expanded");
          islandText.textContent = "";
          islandPop.innerHTML = '<div style="font-size:12px;color:var(--text-secondary);padding:6px;">当前无待拍板门禁或异常阻断</div>';
        } else {
          island.classList.add("has-events");
          islandText.textContent = totalEvents + " 项待处理";
          islandPop.innerHTML = '<div style="font-size:12px;padding:6px;cursor:pointer;" id="island-jump-decisions">待拍板门禁 ' + openEscCount + ' 项 · 会话关注 ' + attnCount + ' 项（点击跳转）</div>';
        }

        const cells = [
          {
            title: "T0→T1 采集",
            p50: fmtMs(lat.t0_t1_ingest && lat.t0_t1_ingest.p50_ms),
            p95: fmtMs(lat.t0_t1_ingest && lat.t0_t1_ingest.p95_ms),
            p99: fmtMs(lat.t0_t1_ingest && lat.t0_t1_ingest.p99_ms)
          },
          {
            title: "T1→T2 点Get",
            p50: fmtMs(lat.t1_t2_ack && lat.t1_t2_ack.p50_ms),
            p95: fmtMs(lat.t1_t2_ack && lat.t1_t2_ack.p95_ms),
            p99: fmtMs(lat.t1_t2_ack && lat.t1_t2_ack.p99_ms)
          },
          {
            title: "T1→T3 投递",
            p50: fmtMs(lat.t1_t3_dispatch && lat.t1_t3_dispatch.p50_ms),
            p95: fmtMs(lat.t1_t3_dispatch && lat.t1_t3_dispatch.p95_ms),
            p99: fmtMs(lat.t1_t3_dispatch && lat.t1_t3_dispatch.p99_ms)
          },
          {
            title: "T3→T4 会话",
            p50: fmtMs(lat.t3_t4_session && lat.t3_t4_session.p50_ms),
            p95: fmtMs(lat.t3_t4_session && lat.t3_t4_session.p95_ms),
            p99: fmtMs(lat.t3_t4_session && lat.t3_t4_session.p99_ms)
          },
          {
            title: "T0→T5 回复",
            p50: fmtMs(lat.t0_t5_e2e_reply && lat.t0_t5_e2e_reply.p50_ms),
            p95: fmtMs(lat.t0_t5_e2e_reply && lat.t0_t5_e2e_reply.p95_ms),
            p99: fmtMs(lat.t0_t5_e2e_reply && lat.t0_t5_e2e_reply.p99_ms)
          }
        ];

        el.innerHTML = cells.map(function (c) {
          return (
            '<div class="golden-cell">' +
              '<div class="golden-label"><span>' + escHtml(c.title) + '</span><span class="mono">P50</span></div>' +
              '<div class="golden-value mono">' + escHtml(c.p50) + '</div>' +
              '<div class="golden-sub mono">P95 ' + escHtml(c.p95) + ' · P99 ' + escHtml(c.p99) + '</div>' +
            '</div>'
          );
        }).join("");
      }

      /* 渲染左栏三级会话树（严格执行单行最多 3 可见元素 + Hover 最右端 ⋯ + 内嵌 1.5px 细线折叠 Subagents） */
      function renderLeftSessionTree() {
        const container = document.getElementById("left-session-tree");
        const groups = (STATE.sessionsData && STATE.sessionsData.groups) || [];
        let html = "";

        groups.forEach(function (g) {
          const sessions = g.sessions || [];
          if (!sessions.length) return;
          html += '<div class="tree-section-header"><span>' + escHtml(g.label) + '</span><span class="mono">' + sessions.length + '</span></div>';
          sessions.slice(0, 18).forEach(function (s) {
            const isSel = s.topic_id === STATE.selectedTopicId;
            const dotClass = escHtml(s.visual_state || s.state || "active");
            const displayName = escHtml(s.topic_id + " · " + (s.title || s.topic_id));
            html += (
              '<div class="specialist-row' + (isSel ? " selected" : "") + '" data-topic-id="' + escHtml(s.topic_id) + '">' +
                '<div class="row-left-cluster">' +
                  '<span class="row-avatar">' + renderLinearIconSvg("bot", 13) + '</span>' +
                  '<span class="row-name">' + displayName + '</span>' +
                  '<span class="status-dot ' + dotClass + '" title="状态: ' + dotClass + '"></span>' +
                  '<span class="tier-pill">' + escHtml(s.kind) + '</span>' +
                  '<span class="model-badge">' + escHtml(s.model) + '</span>' +
                '</div>' +
                '<button class="row-dots-btn" data-dots-topic="' + escHtml(s.topic_id) + '" title="更多会话操作" aria-label="更多会话操作">' +
                  renderLinearIconSvg("dots", 14) +
                '</button>' +
              '</div>'
            );

            // 若有 Subagent / Lambs，作为顶级会话行下方的内嵌 1.5px 垂直细线折叠区（最多展示最新 3 条单行）
            const lambs = s.lambs || [];
            if (lambs.length > 0) {
              const previewLambs = lambs.slice(0, 3);
              html += '<div class="meru-realm-thread-preview" data-parent-topic="' + escHtml(s.topic_id) + '">';
              previewLambs.forEach(function (lb) {
                html += (
                  '<div class="thread-preview-line" data-lamb-id="' + escHtml(lb.lamb_id) + '" data-parent-topic="' + escHtml(s.topic_id) + '">' +
                    '<span class="sub-agent-tag mono">' + escHtml(lb.lamb_id) + '</span>' +
                    '<span class="sub-summary">' + escHtml("[" + lb.state + "] " + lb.task_title) + '</span>' +
                  '</div>'
                );
              });
              html += '</div>';
            }
          });
        });

        container.innerHTML = html;
      }

      /* 渲染中栏四大核心视图 */
      function renderCenterView() {
        const titleEl = document.getElementById("center-view-title");
        const subEl = document.getElementById("center-view-subtitle");
        const area = document.getElementById("center-content-area");

        document.querySelectorAll("[data-nav]").forEach(function (btn) {
          btn.classList.toggle("active", btn.getAttribute("data-nav") === STATE.activeView);
        });

        if (STATE.activeView === "sessions") {
          titleEl.textContent = "三级会话工作状态";
          subEl.textContent = "Session Group · Primary Session · Subagent & Stop Hook 实时状态";
          renderSessionsCenterView(area);
        } else if (STATE.activeView === "waterfall") {
          titleEl.textContent = "事件耗时瀑布流";
          subEl.textContent = "T0 飞书发出 -> T1 扫到 -> T2 点 Get -> T3 投递 -> T4 会话回执 -> T5 回复飞书";
          renderWaterfallCenterView(area);
        } else if (STATE.activeView === "decisions") {
          titleEl.textContent = "三层决策数据可观测";
          subEl.textContent = "找人拍板账本（采纳 vs 人类改判错题本 vs 免问晋升候选） · tp_bus 路由决策 · Stop Hook 门禁";
          renderDecisionsCenterView(area);
        } else {
          titleEl.textContent = "花名册与运维台账";
          subEl.textContent = "VIP 联系人管理 · 在办工作项 (work_items) · 等待外部回复 (watches) · 长期事项";
          renderAdminCenterView(area);
        }
      }

      /* 视图 1：三级会话工作状态矩阵 */
      function renderSessionsCenterView(area) {
        const groups = (STATE.sessionsData && STATE.sessionsData.groups) || [];
        const hooks = (STATE.sessionsData && STATE.sessionsData.recent_hook_calls) || [];

        let html = (
          '<div class="sub-toolbar">' +
            '<div class="filter-pills">' +
              '<span class="state-tag running">运行中会话 ' + ((STATE.overview && STATE.overview.counts && STATE.overview.counts.topics_running) || 0) + '</span>' +
              '<span class="state-tag active">运行中 Subagent ' + ((STATE.overview && STATE.overview.counts && STATE.overview.counts.lambs_running) || 0) + '</span>' +
              '<span class="state-tag pending">待人类拍板 ' + ((STATE.overview && STATE.overview.counts && STATE.overview.counts.open_escalations) || 0) + '</span>' +
            '</div>' +

      /* 视图 2：端到端 + 会话内各事件耗时瀑布流 */
      function renderWaterfallCenterView(area) {
        const wf = STATE.waterfallData || { total: 0, offset: 0, limit: 50, events: [] };
        const events = wf.events || [];

        let html = (
          '<div class="sub-toolbar">' +
            '<div class="filter-pills">' +
              '<button class="filter-pill' + (STATE.waterfallFilterRoute === "" ? " active" : "") + '" data-wf-route="">全部 (' + wf.total + ')</button>' +

              '<button class="filter-pill' + (STATE.waterfallFilterRoute === "inbox" ? " active" : "") + '" data-wf-route="inbox">收件箱 (inbox)</button>' +
              '<button class="filter-pill' + (STATE.waterfallFilterRoute === "drop" ? " active" : "") + '" data-wf-route="drop">静默过滤 (drop)</button>' +
            '</div>' +
            '<div class="search-input-wrap">' +
              renderLinearIconSvg("search", 13) +
              '<input type="text" id="wf-search-input" placeholder="搜消息正文、发送人、会话或 om_..." value="' + escHtml(STATE.waterfallQuery) + '" />' +
            '</div>' +
          '</div>' +
          '<table class="waterfall-table">' +
            '<thead><tr>' +
              '<th>T0 · 来源</th>' +
              '<th>消息摘要 · 会话</th>' +
              '<th>T1 扫到</th>' +
              '<th>T2 Get</th>' +
              '<th>T3 投递</th>' +
              '<th>T4 会话</th>' +
              '<th>T5 回复</th>' +
              '<th style="width:110px;">耗时甘特条</th>' +
            '</tr></thead><tbody>'
        );

        events.forEach(function (ev) {
          const d = ev.durations_ms || {};
          const total = Math.max(1, d.total || 1000);
          const pIngest = Math.min(100, Math.max(4, Math.round(((d.ingest || 50) / total) * 100)));
          const pQueue = Math.min(100 - pIngest, Math.max(4, Math.round(((d.queue || 0) / total) * 100)));
          const pExec = Math.min(100 - pIngest - pQueue, Math.max(6, Math.round(((d.session_exec || 0) / total) * 100)));
          const pReply = Math.max(0, 100 - pIngest - pQueue - pExec);
          const isSel = ev.message_id === STATE.selectedMessageId;

          html += (
            '<tr class="waterfall-row' + (isSel ? " selected" : "") + '" data-trace-mid="' + escHtml(ev.message_id) + '">' +
              '<td><div class="mono" style="font-size:11px;color:var(--text-secondary);">' + escHtml(fmtShortTime(ev.timestamps && ev.timestamps.t0_created)) + '</div><div style="font-weight:500;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(ev.sender_name) + '</div></td>' +
              '<td style="max-width:185px;"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(ev.content_preview) + '</div><div class="mono" style="font-size:11px;color:var(--accent-indigo);">' + escHtml(ev.topic_id || ev.reason || ev.route) + '</div></td>' +
              '<td class="mono">' + escHtml(fmtMs(d.ingest)) + '</td>' +
              '<td class="mono">' + escHtml(fmtMs(d.ack)) + '</td>' +
              '<td class="mono">' + escHtml(fmtMs(d.queue)) + '</td>' +
              '<td class="mono">' + escHtml(fmtMs(d.session_exec)) + '</td>' +
              '<td class="mono" style="font-weight:600;color:var(--accent-emerald);">' + escHtml(fmtMs(d.e2e_reply)) + '</td>' +
              '<td><div class="gantt-track" title="蓝:采集 橙:排队 靛:会话执行 绿:飞书回复">' +
                '<div class="gantt-seg-ingest" style="width:' + pIngest + '%"></div>' +
                '<div class="gantt-seg-queue" style="width:' + pQueue + '%"></div>' +
                '<div class="gantt-seg-exec" style="width:' + pExec + '%"></div>' +
                '<div class="gantt-seg-reply" style="width:' + pReply + '%"></div>' +
              '</div></td>' +
            '</tr>'
          );
        });

        html += (
          '</tbody></table>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;">' +
            '<span class="mono" style="font-size:12px;color:var(--text-secondary);">显示 ' + (wf.offset + 1) + ' - ' + Math.min(wf.total, wf.offset + events.length) + ' / 共 ' + wf.total + ' 条</span>' +
            '<div class="filter-pills">' +
              '<button class="filter-pill" id="wf-prev-page"' + (wf.offset <= 0 ? " disabled" : "") + '>上一页</button>' +
              '<button class="filter-pill" id="wf-next-page"' + (wf.offset + wf.limit >= wf.total ? " disabled" : "") + '>下一页</button>' +
            '</div>' +
          '</div>'
        );

        area.innerHTML = html;
      }

        }
      }

      /* 右栏标签 1：agy app 同款 100% 全高左右分栏文件目录视图 */
      function renderStageFiles3Pane(bodyEl) {
        const activeRealm = (STATE.workspaceFiles && STATE.workspaceFiles.active_realm) || [];
        const wholeDrive = (STATE.workspaceFiles && STATE.workspaceFiles.whole_drive) || [];
        const fc = STATE.fileContent || { path: STATE.selectedFilePath, lines: [] };
        const lines = fc.lines || [];

        const codeRowsHtml = (lines.length ? lines : ["# 正在加载文件内容..."]).map(function (line, idx) {
          return (
            '<tr>' +
              '<td class="code-line-num mono">' + (idx + 1) + '</td>' +
              '<td class="code-line-text mono">' + escHtml(line) + '</td>' +
            '</tr>'
          );
        }).join("");

        bodyEl.innerHTML = (
          '<div class="stage-files-3pane" data-ui="stage-files-3pane">' +
            '<div class="stage-pane-preview" data-ui="stage-pane-preview">' +
              '<div class="preview-sticky-header">' +
                '<span class="mono">' + escHtml(fc.path || STATE.selectedFilePath) + '</span>' +
                '<span class="mono">' + lines.length + ' lines</span>' +
              '</div>' +
              '<table class="code-lines-table"><tbody>' + codeRowsHtml + '</tbody></table>' +
            '</div>' +
            '<div class="workspace-tree-sidebar">' +
              '<div class="workspace-tree-toolbar">' +
                '<span>Workspace ⌄</span>' +
                '<div class="nav-icon-group">' +
                  '<button class="icon-btn" style="width:22px;height:22px;" title="刷新文件目录" aria-label="刷新文件目录" id="btn-refresh-files">' + renderLinearIconSvg("refresh", 12) + '</button>' +
                '</div>' +
              '</div>' +
              '<div class="file-tree-group" data-ui="stage-pane-active-realm">' +
                '<div class="file-tree-group-title"><span>当前识界 (Runtime)</span></div>' +
                activeRealm.map(function (f) {
                  return (
                    '<div class="file-tree-item' + (f.path === STATE.selectedFilePath ? " active" : "") + '" data-file-path="' + escHtml(f.path) + '">' +
                      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(f.name) + '</span>' +
                      '<span class="file-type-badge mono">' + escHtml(f.badge) + '</span>' +
                    '</div>'
                  );
                }).join("") +
              '</div>' +
              '<div class="file-tree-group" data-ui="stage-pane-whole-drive">' +
                '<div class="file-tree-group-title"><span>Whole Drive (Repo)</span></div>' +
                wholeDrive.map(function (f) {
                  return (
                    '<div class="file-tree-item' + (f.path === STATE.selectedFilePath ? " active" : "") + '" data-file-path="' + escHtml(f.path) + '">' +
                      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(f.name) + '</span>' +
                      '<span class="file-type-badge mono">' + escHtml(f.badge) + '</span>' +
                    '</div>'
                  );
                }).join("") +
              '</div>' +
            '</div>' +
          '</div>'
        );
      }

      /* 右栏标签 2：单条飞书消息 6 阶段时间轴 + 会话内 transcript.jsonl 步进耗时瀑布 */
      function renderStageTracePane(bodyEl) {
        let html = '<div class="stage-trace-scroll">';

        if (STATE.eventTrace && STATE.eventTrace.stages) {
          const et = STATE.eventTrace;
          const m = et.message || {};
          html += (
            '<div style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border-hairline);">' +
              '<div style="font-size:12px;font-weight:600;color:var(--accent-indigo);margin-bottom:4px;">飞书消息端到端耗时追踪 · ' + escHtml(m.message_id) + '</div>' +
              '<div style="font-size:12px;color:var(--text-primary);margin-bottom:10px;">' + escHtml(m.sender_name + " (" + m.chat_name + "): " + m.content) + '</div>' +
              '<div class="timeline-vertical">' +
              (et.stages || []).map(function (st) {
                const cls = st.code === "T5" ? "done" : (st.code === "T3" ? "wait" : "");
                const dTxt = st.delta_ms != null ? ("+" + fmtMs(st.delta_ms)) : "—";
                return (
                  '<div class="timeline-node ' + cls + '">' +
                    '<div class="timeline-node-head">' +
                      '<span>' + escHtml(st.code + " · " + st.name) + '</span>' +
                      '<span class="mono" style="color:var(--accent-emerald);">' + escHtml(dTxt) + '</span>' +
                    '</div>' +
                    '<div class="timeline-node-meta mono">' + escHtml(fmtShortTime(st.at)) + ' · ' + escHtml(st.detail) + '</div>' +
                  '</div>'
                );
              }).join("") +
              '</div>' +
            '</div>'
          );
        }

        const sd = STATE.sessionDetail;
        if (sd && sd.topic) {
          const tp = sd.topic;
          const steps = sd.transcript_steps || [];
          const lambs = sd.lambs || [];
          html += (
            '<div style="margin-bottom:14px;">' +
              '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">' +
                '<span style="font-size:12px;font-weight:600;">会话内步进瀑布流 · <span class="mono">' + escHtml(tp.topic_id) + '</span></span>' +
                '<span class="state-tag ' + escHtml(tp.state) + '">' + escHtml(tp.state) + '</span>' +
              '</div>'
          );

          if (steps.length > 0) {
            html += '<div class="timeline-vertical">';
            steps.slice(-18).forEach(function (st) {
              html += (
                '<div class="timeline-node">' +
                  '<div class="timeline-node-head">' +
                    '<span>' + escHtml(st.label) + '</span>' +
                    '<span class="mono">' + escHtml(fmtMs(st.duration_ms)) + '</span>' +
                  '</div>' +
                  '<div class="timeline-node-meta">' + escHtml(st.detail) + '</div>' +
                '</div>'
              );
            });
            html += '</div>';
          } else {
            html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">从 duty_history 展示最近会话动作：</div>';
            html += '<div class="timeline-vertical">' +
              (sd.duty_history || []).slice(0, 10).map(function (h) {
                return (
                  '<div class="timeline-node">' +
                    '<div class="timeline-node-head"><span>' + escHtml(h.kind) + '</span><span class="mono">' + escHtml(fmtShortTime(h.at)) + '</span></div>' +
                    '<div class="timeline-node-meta">' + escHtml(h.text) + '</div>' +
                  '</div>'
                );
              }).join("") +
            '</div>';
          }

          if (lambs.length > 0) {
            html += (
              '<div style="margin-top:16px;">' +
                '<div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;">隶属 Subagents / CLI 羔羊 (' + lambs.length + ')</div>' +
                lambs.slice(0, 8).map(function (lb) {
                  return (
                    '<div style="padding:6px 8px;border-bottom:1px solid var(--border-hairline);display:flex;justify-content:space-between;align-items:center;">' +
                      '<div><span class="mono" style="font-weight:500;">' + escHtml(lb.lamb_id) + '</span> · ' + escHtml(lb.task_title) + '</div>' +
                      '<span class="state-tag ' + (lb.state === "running" ? "running" : "accepted") + ' mono">' + escHtml(lb.state + " · " + fmtMs(lb.duration_ms)) + '</span>' +
                    '</div>'
                  );
                }).join("") +
              '</div>'
            );
          }
          html += '</div>';
        }

        html += '</div>';
        bodyEl.innerHTML = html;
      }

      /* 打开左键 ⋯ 与右键 100% 同源菜单 */
      function openSharedContextMenu(topicId, clientX, clientY) {
        STATE.contextTargetTopic = topicId;
        const menu = document.getElementById("shared-context-menu");
        menu.innerHTML = (
          '<div style="padding:4px 8px;font-size:11px;color:var(--text-muted);" class="mono">' + escHtml(topicId) + '</div>' +
          '<button class="ctx-menu-item" data-ctx-action="inspect_trace"><span>查看会话步进耗时瀑布</span></button>' +
          '<button class="ctx-menu-item" data-ctx-action="clear_hook_block"><span>清除 Stop Hook 拦截计数</span></button>' +
          '<button class="ctx-menu-item" data-ctx-action="set_active"><span>重置会话状态为 active</span></button>'
        );
        const x = Math.min(window.innerWidth - 190, Math.max(8, clientX));
        const y = Math.min(window.innerHeight - 140, Math.max(8, clientY));
        menu.style.left = x + "px";
        menu.style.top = y + "px";
        menu.classList.add("open");
      }

      function closeSharedContextMenu() {
        document.getElementById("shared-context-menu").classList.remove("open");
      }

      /* 数据加载函数 */
      async function loadAllData() {
        const [ov, sess, wf, dec, adm, files] = await Promise.all([
          apiGet("/api/overview?minutes=1440"),
          apiGet("/api/sessions"),
          apiGet("/api/events/waterfall?limit=" + STATE.waterfallData.limit + "&offset=" + STATE.waterfallData.offset + "&route=" + encodeURIComponent(STATE.waterfallFilterRoute) + "&q=" + encodeURIComponent(STATE.waterfallQuery)),
          apiGet("/api/decisions"),
          apiGet("/api/admin/state"),
          apiGet("/api/files")
        ]);
        STATE.overview = ov;
        STATE.sessionsData = sess;
        STATE.waterfallData = wf;
        STATE.decisionsData = dec;
        STATE.adminData = adm;
        STATE.workspaceFiles = files;

        if (!STATE.selectedMessageId && wf.events && wf.events.length) {
          const dispEv = wf.events.find(function (x) { return x.route === "dispatch"; }) || wf.events[0];
          STATE.selectedMessageId = dispEv.message_id;
        }

        const [sDetail, fContent] = await Promise.all([
          apiGet("/api/sessions/detail?topic_id=" + encodeURIComponent(STATE.selectedTopicId)),
          apiGet("/api/file-content?path=" + encodeURIComponent(STATE.selectedFilePath))
        ]);
        STATE.sessionDetail = sDetail;
        STATE.fileContent = fContent;
        if (STATE.selectedMessageId) {
          STATE.eventTrace = await apiGet("/api/events/trace?message_id=" + encodeURIComponent(STATE.selectedMessageId));
        }

        renderGoldenSignals();
        renderLeftSessionTree();
        renderCenterView();
        renderRightStage();
      }

      async function selectSession(topicId, switchStageToTrace) {
        STATE.selectedTopicId = topicId;
        STATE.sessionDetail = await apiGet("/api/sessions/detail?topic_id=" + encodeURIComponent(topicId));
        if (switchStageToTrace) {
          if (!STATE.openStageTabs.some(function (t) { return t.id === "trace"; })) {
            STATE.openStageTabs.unshift({ id: "trace", title: "耗时与步进追踪" });
          }
          STATE.activeStageTab = "trace";
        }
        renderLeftSessionTree();
        renderCenterView();
        renderRightStage();
      }

      async function selectEventTrace(messageId) {
        STATE.selectedMessageId = messageId;
        STATE.eventTrace = await apiGet("/api/events/trace?message_id=" + encodeURIComponent(messageId));
        if (STATE.eventTrace && STATE.eventTrace.message && STATE.eventTrace.message.topic_id) {
          STATE.selectedTopicId = STATE.eventTrace.message.topic_id;
          STATE.sessionDetail = await apiGet("/api/sessions/detail?topic_id=" + encodeURIComponent(STATE.selectedTopicId));
        }
        if (!STATE.openStageTabs.some(function (t) { return t.id === "trace"; })) {
          STATE.openStageTabs.unshift({ id: "trace", title: "耗时与步进追踪" });
        }
        STATE.activeStageTab = "trace";
        renderCenterView();
        renderRightStage();
      }

      /* 事件委托绑定 */
      document.addEventListener("click", async function (e) {
        const target = e.target;

        // 1. 左侧菜单外点击关闭上下文菜单
        if (!target.closest("#shared-context-menu") && !target.closest(".row-dots-btn")) {
          closeSharedContextMenu();
        }

        // 2. 顶栏导航按钮切换
        const navBtn = target.closest("[data-nav]");
        if (navBtn) {
          STATE.activeView = navBtn.getAttribute("data-nav");
          renderCenterView();
          return;
        }

        // 3. 左栏 ⋯ 按钮点击（与右键菜单完全同源）
        const dotsBtn = target.closest(".row-dots-btn");
        if (dotsBtn) {
          e.stopPropagation();
          const tid = dotsBtn.getAttribute("data-dots-topic");
          const rect = dotsBtn.getBoundingClientRect();
          openSharedContextMenu(tid, rect.left, rect.bottom + 4);
          return;
        }

        // 4. 左栏会话行或中栏会话行点击
        const sessRow = target.closest(".specialist-row, [data-select-topic]");
        if (sessRow && !target.closest("[data-trace-mid]") && !target.closest("[data-resolve-esc]")) {
          const tid = sessRow.getAttribute("data-topic-id") || sessRow.getAttribute("data-select-topic");
          if (tid) {
            await selectSession(tid, true);
            return;
          }
        }

        // 5. 瀑布流事件行点击
        const wfRow = target.closest("[data-trace-mid]");
        if (wfRow) {
          const mid = wfRow.getAttribute("data-trace-mid");
          if (mid) {
            await selectEventTrace(mid);
            return;
          }
        }

        // 6. 瀑布流路由过滤与分页
        const wfRouteBtn = target.closest("[data-wf-route]");
        if (wfRouteBtn) {
          STATE.waterfallFilterRoute = wfRouteBtn.getAttribute("data-wf-route") || "";
          STATE.waterfallData.offset = 0;
          STATE.waterfallData = await apiGet("/api/events/waterfall?limit=" + STATE.waterfallData.limit + "&offset=0&route=" + encodeURIComponent(STATE.waterfallFilterRoute) + "&q=" + encodeURIComponent(STATE.waterfallQuery));
          renderCenterView();
          return;
        }
        if (target.closest("#wf-prev-page")) {
          STATE.waterfallData.offset = Math.max(0, STATE.waterfallData.offset - STATE.waterfallData.limit);
          STATE.waterfallData = await apiGet("/api/events/waterfall?limit=" + STATE.waterfallData.limit + "&offset=" + STATE.waterfallData.offset + "&route=" + encodeURIComponent(STATE.waterfallFilterRoute) + "&q=" + encodeURIComponent(STATE.waterfallQuery));
          renderCenterView();
          return;
        }
        if (target.closest("#wf-next-page")) {
          STATE.waterfallData.offset = STATE.waterfallData.offset + STATE.waterfallData.limit;
          STATE.waterfallData = await apiGet("/api/events/waterfall?limit=" + STATE.waterfallData.limit + "&offset=" + STATE.waterfallData.offset + "&route=" + encodeURIComponent(STATE.waterfallFilterRoute) + "&q=" + encodeURIComponent(STATE.waterfallQuery));
          renderCenterView();
          return;
        }

        // 7. 决策账本分类过滤
        const decBtn = target.closest("[data-dec-filter]");
        if (decBtn) {
          STATE.decisionFilter = decBtn.getAttribute("data-dec-filter") || "all";
          renderCenterView();
          return;
        }

        // 8. 花名册 VIP 切换与在办事项完成
        const vipBtn = target.closest("[data-toggle-vip]");
        if (vipBtn) {
          const pName = vipBtn.getAttribute("data-toggle-vip");
          await apiAction({ action: "toggle_vip", name: pName });
          STATE.adminData = await apiGet("/api/admin/state");
          renderCenterView();
          return;
        }
        const workBtn = target.closest("[data-complete-work]");
        if (workBtn) {
          const pair = (workBtn.getAttribute("data-complete-work") || "").split("::");
          if (pair.length === 2) {
            await apiAction({ action: "complete_work_item", topic_id: pair[0], key: pair[1] });
            STATE.adminData = await apiGet("/api/admin/state");
            renderCenterView();
          }
          return;
        }
        const resolveEscBtn = target.closest("[data-resolve-esc]");
        if (resolveEscBtn) {
          e.stopPropagation();
          const mid = resolveEscBtn.getAttribute("data-resolve-esc");
          if (mid) {
            await apiAction({ action: "resolve_escalation", message_id: mid, note: "工作台人工结案" });
            STATE.decisionsData = await apiGet("/api/decisions");
            renderCenterView();
          }
          return;
        }
        const closeWatchBtn = target.closest("[data-close-watch]");
        if (closeWatchBtn) {
          const wid = parseInt(closeWatchBtn.getAttribute("data-close-watch") || "0", 10);
          if (wid > 0) {
            await apiAction({ action: "close_watch", id: wid });
            STATE.adminData = await apiGet("/api/admin/state");
            renderCenterView();
          }
          return;
        }

        // 9. 右栏舞台标签切换与关闭（×）
        const closeTabBtn = target.closest("[data-close-stage-tab]");
        if (closeTabBtn) {
          e.stopPropagation();
          const cid = closeTabBtn.getAttribute("data-close-stage-tab");
          STATE.openStageTabs = STATE.openStageTabs.filter(function (t) { return t.id !== cid; });
          if (STATE.activeStageTab === cid) {
            STATE.activeStageTab = STATE.openStageTabs.length ? STATE.openStageTabs[0].id : "";
          }
          renderRightStage();
          return;
        }
        const stageTab = target.closest("[data-stage-tab]");
        if (stageTab) {
          STATE.activeStageTab = stageTab.getAttribute("data-stage-tab");
          renderRightStage();
          return;
        }
        if (target.closest("#btn-restore-stage-tabs")) {
          STATE.openStageTabs = [
            { id: "trace", title: "耗时与步进追踪" },
            { id: "files", title: "文件目录" }
          ];
          STATE.activeStageTab = "files";
          renderRightStage();
          return;
        }

        // 10. 右栏文件目录点击切换文件预览
        const fileItem = target.closest("[data-file-path]");
        if (fileItem) {
          const fp = fileItem.getAttribute("data-file-path");
          STATE.selectedFilePath = fp;
          STATE.fileContent = await apiGet("/api/file-content?path=" + encodeURIComponent(fp));
          renderRightStage();
          return;
        }

        // 11. 共享右键菜单动作
        const ctxItem = target.closest("[data-ctx-action]");
        if (ctxItem && STATE.contextTargetTopic) {
          const act = ctxItem.getAttribute("data-ctx-action");
          const tid = STATE.contextTargetTopic;
          closeSharedContextMenu();
          if (act === "inspect_trace") {
            await selectSession(tid, true);
          } else if (act === "clear_hook_block") {
            await apiAction({ action: "clear_hook_block", topic_id: tid });
            await loadAllData();
          } else if (act === "set_active") {
            await apiAction({ action: "set_topic_state", topic_id: tid, state: "active" });
            await loadAllData();
          }
          return;
        }

        // 12. 灵动岛展开/收起与跳转
        if (target.closest("#island-jump-decisions")) {
          STATE.activeView = "decisions";
          document.getElementById("dynamic-island").classList.remove("expanded");
          renderCenterView();
          return;
        }
        if (target.closest("#dynamic-island")) {
          document.getElementById("dynamic-island").classList.toggle("expanded");
          return;
        }

        // 13. 顶栏与设置弹窗动作
        if (target.closest("#btn-refresh-all") || target.closest("#btn-refresh-files")) {
          await loadAllData();
          return;
        }
        if (target.closest("#btn-toggle-stage")) {
          const st = document.getElementById("right-stage");
          st.classList.toggle("collapsed");
          document.getElementById("btn-toggle-stage").classList.toggle("active", !st.classList.contains("collapsed"));
          return;
        }
        if (target.closest("#btn-focus-search")) {
          STATE.activeView = "waterfall";
          renderCenterView();
          const inp = document.getElementById("wf-search-input");
          if (inp) inp.focus();
          return;
        }
        if (target.closest("#settings-trigger-btn") || target.closest("#profile-trigger-btn")) {
          document.getElementById("settings-modal-backdrop").classList.add("open");
          return;
        }
        if (target.closest("#btn-close-settings") || target.id === "settings-modal-backdrop") {
          document.getElementById("settings-modal-backdrop").classList.remove("open");
          return;
        }
        if (target.closest("#btn-toggle-theme")) {
          const root = document.documentElement;
          const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
          root.setAttribute("data-theme", next);
          return;
        }
      });

      // 右键点击左栏会话行：弹出与 ⋯ 100% 同源的 #shared-context-menu
      document.addEventListener("contextmenu", function (e) {
        const row = e.target.closest(".specialist-row, .meru-human-member-row");
        if (row) {
          e.preventDefault();
          const tid = row.getAttribute("data-topic-id");
          if (tid) {
            openSharedContextMenu(tid, e.clientX, e.clientY);
          }
        }
      });

      // 搜索框回车或输入过滤
      document.addEventListener("keydown", async function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          STATE.activeView = "waterfall";
          renderCenterView();
          const inp = document.getElementById("wf-search-input");
          if (inp) inp.focus();
        }
        if (e.target && e.target.id === "wf-search-input" && e.key === "Enter") {
          STATE.waterfallQuery = e.target.value || "";
          STATE.waterfallData.offset = 0;
          STATE.waterfallData = await apiGet("/api/events/waterfall?limit=" + STATE.waterfallData.limit + "&offset=0&route=" + encodeURIComponent(STATE.waterfallFilterRoute) + "&q=" + encodeURIComponent(STATE.waterfallQuery));
          renderCenterView();
        }
      });

      initStaticIcons();
      loadAllData();
      setInterval(loadAllData, 10000);
    })();
  </script>
</body>
</html>
