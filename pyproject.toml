[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheepdog"
version = "0.1.0"
description = "牧羊犬：盯着你的 IM，把信号赶进对应的 AI Agent session，并管好这群 session。"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sheepdog = "sheepdog.cli:main"

[tool.setuptools.packages.find]
include = ["sheepdog*"]
