[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheepdog"
dynamic = ["version"]
description = "你的工作助理：第一项工作是接收 IM 上的工作，分给负责的 AI Agent session（像牧羊犬一样看好这群 session）。"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Matthew Hong", email = "matthewohmygosh@gmail.com" }
]
keywords = [
    "agent",
    "multi-agent",
    "feishu",
    "lark",
    "supervisor",
    "orchestration",
    "state-machine",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[project.urls]
Homepage = "https://github.com/Matthewoho/sheepdog"
Repository = "https://github.com/Matthewoho/sheepdog.git"
Issues = "https://github.com/Matthewoho/sheepdog/issues"

[project.scripts]
sheepdog = "sheepdog.cli:main"

[tool.setuptools.packages.find]
include = ["sheepdog*"]

[tool.setuptools.dynamic]
version = {attr = "sheepdog.__version__"}
